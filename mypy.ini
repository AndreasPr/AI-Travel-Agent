[mypy]
python_version = 3.11
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True

# SQLAlchemy migration columns mix unrelated concrete SQL types in literal lists.
[mypy-backend.alembic.versions.*]
disable_error_code = arg-type

[mypy-requests.*]
ignore_missing_imports = True

# mypy 1.13 crashes in multiple Transformers model-processor implementations.
# Treat that third-party implementation namespace as Any; keep backend checking.
[mypy-transformers.models.*]
follow_imports = skip
