name: Offline evaluation gate
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  recorded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pydantic PyYAML numpy scipy python-decouple pytest
      - run: python -m pytest -q tests/eval/test_eval_offline_imports.py
      - run: make eval-gate
