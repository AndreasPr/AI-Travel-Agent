name: Offline evaluation gate
on: [pull_request]
permissions:
  contents: read
jobs:
  recorded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic PyYAML numpy scipy python-decouple pytest
      - run: python -m pytest -q tests/test_eval_offline_imports.py
      - run: make eval-gate
